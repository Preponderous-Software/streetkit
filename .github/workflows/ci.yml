name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # every command's failure fails the step, on Windows too
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Python
        run: uv run --python 3.12 --extra city pytest -q   # city: the extract reader too
      - name: Fixture tiles
        run: uv run --python 3.12 python tests/make_fixture.py build/fixture
      - name: C++
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure
